<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#37536b"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5fbff"/><stop offset="1" stop-color="#e6f1f8"/></linearGradient></defs>
<style>text{font-family:Arial,sans-serif;fill:#173247;font-size:18px;font-weight:700}.title{font-size:30px}.sub{font-size:17px;font-weight:500;fill:#466276}.tag{font-size:15px;fill:#fff}.b{stroke:#fff;stroke-width:2}.host{fill:#334e68}.cdr{fill:#32b6d8}.driver{fill:#4284b5}.tia{fill:#76cbd0}.optic{fill:#67ca73}.mux{fill:#9abbd2}.fiber{fill:#eebf45}.arr{fill:none;stroke:#37536b;stroke-width:3;marker-end:url(#a)}.lane{font-size:15px;font-weight:600}.note{font-size:14px;font-weight:500;fill:#5f7180}</style>
<rect width="1200" height="675" rx="30" fill="url(#bg)"/><text class="title" x="600" y="55" text-anchor="middle">OSFP 800GBASE-DR8 Working Principle</text>
<rect x="70" y="82" width="220" height="36" rx="18" fill="#173f5f"/><text class="tag" x="180" y="106" text-anchor="middle">HOST: 8 × 106.25G PAM4</text>
<rect x="305" y="82" width="350" height="36" rx="18" fill="#167d91"/><text class="tag" x="480" y="106" text-anchor="middle">OPTICAL: 8 × 100G 1310 nm</text>
<rect x="670" y="82" width="300" height="36" rx="18" fill="#9b6b18"/><text class="tag" x="820" y="106" text-anchor="middle">SMF • MPO-16</text>
<text x="70" y="175">TRANSMIT PATH →</text><rect class="host" x="70" y="205" width="145" height="54" rx="16"/><text x="142.5" y="238" text-anchor="middle">8× host TX</text><path class="arr" d="M215 232 H255"/><rect class="cdr" x="255" y="205" width="150" height="54" rx="16"/><text x="330" y="238" text-anchor="middle">CDR / DSP</text><path class="arr" d="M405 232 H445"/><rect class="driver" x="445" y="205" width="150" height="54" rx="16"/><text x="520" y="238" text-anchor="middle">8× drivers</text><path class="arr" d="M595 232 H635"/><rect class="optic" x="635" y="205" width="145" height="54" rx="16"/><text x="707.5" y="238" text-anchor="middle">8× optics</text><path class="arr" d="M780 232 H820"/><rect class="fiber" x="820" y="190" width="150" height="84" rx="16"/><text x="895" y="238" text-anchor="middle">Parallel TX fibers</text><text x="70" y="390">← RECEIVE PATH</text><rect class="host" x="70" y="420" width="145" height="54" rx="16"/><text x="142.5" y="453" text-anchor="middle">Host RX lanes</text><path class="arr" d="M255 447 H215"/><rect class="cdr" x="255" y="420" width="150" height="54" rx="16"/><text x="330" y="453" text-anchor="middle">CDR / DSP</text><path class="arr" d="M445 447 H405"/><rect class="tia" x="445" y="420" width="150" height="54" rx="16"/><text x="520" y="453" text-anchor="middle">8× TIAs</text><path class="arr" d="M635 447 H595"/><rect class="optic" x="635" y="420" width="145" height="54" rx="16"/><text x="707.5" y="453" text-anchor="middle">8× detectors</text><path class="arr" d="M820 447 H780"/><rect class="fiber" x="820" y="405" width="150" height="84" rx="16"/><text x="895" y="453" text-anchor="middle">Parallel RX fibers</text>
<text class="sub" x="600" y="570" text-anchor="middle">Electrical data → conditioning/DSP → optical conversion → fiber | receiver performs the reverse process</text>
<text class="note" x="600" y="610" text-anchor="middle">Lane rates are nominal architecture labels; exact baud rate, FEC and coding depend on the standard/MSA.</text>
</svg>