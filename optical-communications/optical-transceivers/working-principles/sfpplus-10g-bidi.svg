<style>text{font-family:Arial,sans-serif;fill:#173247;font-size:18px;font-weight:700}.title{font-size:30px}.sub{font-size:17px;font-weight:500;fill:#466276}.tag{font-size:15px;fill:#fff}.b{stroke:#fff;stroke-width:2}.host{fill:#334e68}.cdr{fill:#32b6d8}.driver{fill:#4284b5}.tia{fill:#76cbd0}.optic{fill:#67ca73}.mux{fill:#9abbd2}.fiber{fill:#eebf45}.arr{fill:none;stroke:#37536b;stroke-width:3;marker-end:url(#a)}.lane{font-size:15px;font-weight:600}.note{font-size:14px;font-weight:500;fill:#5f7180}</style>
<rect width="1200" height="675" rx="30" fill="url(#bg)"/><text class="title" x="600" y="55" text-anchor="middle">SFP+ 10G BiDi Working Principle</text>
