<text x="70" y="175">TRANSMIT PATH →</text><rect class="host" x="85" y="215" width="130" height="48" rx="16"/><text x="150" y="245" text-anchor="middle">TX input</text><path class="arr" d="M215 239 H255"/><rect class="cdr" x="255" y="215" width="125" height="48" rx="16"/><text x="317.5" y="245" text-anchor="middle">CDR / EQ</text><path class="arr" d="M380 239 H420"/><rect class="driver" x="420" y="215" width="135" height="48" rx="16"/><text x="487.5" y="245" text-anchor="middle">Laser driver</text><path class="arr" d="M555 239 H595"/><rect class="optic" x="595" y="215" width="150" height="48" rx="16"/><text x="670" y="245" text-anchor="middle">Laser λA</text><path class="arr" d="M745 239 H805"/><rect class="mux" x="805" y="285" width="150" height="95" rx="16"/><text x="880" y="338.5" text-anchor="middle">WDM diplexer</text><path class="arr" d="M805 239 H780 V310 H805"/><text x="70" y="390">← RECEIVE PATH</text><rect class="host" x="85" y="425" width="130" height="48" rx="16"/><text x="150" y="455" text-anchor="middle">RX output</text><path class="arr" d="M255 449 H215"/><rect class="cdr" x="255" y="425" width="125" height="48" rx="16"/><text x="317.5" y="455" text-anchor="middle">CDR / EQ</text><path class="arr" d="M420 449 H380"/><rect class="tia" x="420" y="425" width="135" height="48" rx="16"/><text x="487.5" y="455" text-anchor="middle">TIA</text><path class="arr" d="M595 449 H555"/><rect class="optic" x="595" y="425" width="150" height="48" rx="16"/><text x="670" y="455" text-anchor="middle">PIN / APD λB</text><path class="arr" d="M805 449 H745"/><path class="arr" d="M805 449 H780 V360 H805"/>
<text class="sub" x="600" y="570" text-anchor="middle">Electrical data → conditioning/DSP → optical conversion → fiber | receiver performs the reverse process</text>
<text class="note" x="600" y="610" text-anchor="middle">Lane rates are nominal architecture labels; exact baud rate, FEC and coding depend on the standard/MSA.</text>
