<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#37536b"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5fbff"/><stop offset="1" stop-color="#e6f1f8"/></linearGradient></defs>
<style>text{font-family:Arial,sans-serif;fill:#173247;font-size:18px;font-weight:700}.title{font-size:28px}.sub{font-size:16px;font-weight:500;fill:#466276}.tag{font-size:14px;fill:#fff}.b{stroke:#fff;stroke-width:2}.host{fill:#334e68}.cdr{fill:#32b6d8}.driver{fill:#4284b5}.tia{fill:#76cbd0}.optic{fill:#67ca73}.mux{fill:#9abbd2}.fiber{fill:#eebf45}.arr{fill:none;stroke:#37536b;stroke-width:3;marker-end:url(#a)}.thin{stroke-width:2}.fiberline{fill:none;stroke:#e8aa20;stroke-width:3}.lane{font-size:13px;font-weight:700}.rate{font-size:10px;font-weight:500}.mini{fill:#173247;font-weight:700}.module{font-size:28px}.module.small{font-size:20px}.port{font-size:12px;fill:#fff}.note{font-size:13px;font-weight:500;fill:#5f7180}</style>
<rect width="1200" height="675" rx="30" fill="url(#bg)"/><text class="title" x="600" y="55" text-anchor="middle">SFP 1000BASE-SX Working Principle</text>
<rect x="70" y="82" width="220" height="36" rx="18" fill="#173f5f"/><text class="tag" x="180" y="106" text-anchor="middle">HOST: 1 × 1.25G NRZ</text>
<rect x="305" y="82" width="350" height="36" rx="18" fill="#167d91"/><text class="tag" x="480" y="106" text-anchor="middle">OPTICAL: 1 × 850 nm</text>
<rect x="670" y="82" width="300" height="36" rx="18" fill="#9b6b18"/><text class="tag" x="820" y="106" text-anchor="middle">MMF • LC duplex</text>
<text x="25" y="145">TRANSMIT PATH →</text><text class="lane" x="25" y="214">TX0</text><text class="rate" x="72" y="214">1.25G</text><path class="arr thin" d="M115 210 H145"/><rect x="145" y="193" width="92" height="34" rx="17" fill="#34b6d5" stroke="#fff"/><text class="mini" style="font-size:14px" x="191" y="214.9" text-anchor="middle">CDR</text><path class="arr thin" d="M237 210 H268"/><rect x="268" y="193" width="95" height="34" rx="17" fill="#4389b9" stroke="#fff"/><text class="mini" style="font-size:14px" x="315.5" y="214.9" text-anchor="middle">Driver</text><path class="arr thin" d="M363 210 H394"/><rect x="394" y="193" width="108" height="34" rx="17" fill="#63cc73" stroke="#fff"/><text class="mini" style="font-size:14px" x="448" y="214.9" text-anchor="middle">Laser 1</text><path class="arr thin" d="M502 210 H555"/><path class="arr thin" d="M502 210 H610"/><rect class="fiber" x="610" y="193" width="145" height="46" rx="16"/><text x="682.5" y="222" text-anchor="middle">TX fiber</text><g transform="translate(790,165)"><rect x="0" y="0" width="190" height="310" rx="14" fill="#d9e3ea" stroke="#7390a4" stroke-width="3"/><rect x="18" y="25" width="154" height="210" rx="8" fill="#edf3f7"/><text x="95" y="70" text-anchor="middle" class="module">SFP</text><text x="95" y="105" text-anchor="middle" class="module small">1G</text><rect x="45" y="245" width="100" height="48" rx="8" fill="#2c5773"/><text x="95" y="275" text-anchor="middle" class="port">OPTICAL PORT</text></g><text x="25" y="365">← RECEIVE PATH</text><text class="lane" x="25" y="434">RX0</text><text class="rate" x="72" y="434">1.25G</text><path class="arr thin" d="M145 430 H115"/><rect x="145" y="413" width="92" height="34" rx="17" fill="#34b6d5" stroke="#fff"/><text class="mini" style="font-size:14px" x="191" y="434.9" text-anchor="middle">CDR</text><path class="arr thin" d="M268 430 H237"/><rect x="268" y="413" width="95" height="34" rx="17" fill="#74cbd0" stroke="#fff"/><text class="mini" style="font-size:14px" x="315.5" y="434.9" text-anchor="middle">TIA</text><path class="arr thin" d="M394 430 H363"/><rect x="394" y="413" width="108" height="34" rx="17" fill="#63cc73" stroke="#fff"/><text class="mini" style="font-size:14px" x="448" y="434.9" text-anchor="middle">PIN 1</text><path class="arr thin" d="M555 430 H502"/><path class="arr thin" d="M610 430 H502"/><rect class="fiber" x="610" y="413" width="145" height="46" rx="16"/><text x="682.5" y="442" text-anchor="middle">RX fiber</text>
<text class="sub" x="600" y="570" text-anchor="middle">Electrical data → conditioning/DSP → optical conversion → fiber | receiver performs the reverse process</text>
<text class="note" x="600" y="610" text-anchor="middle">Lane rates are nominal architecture labels; exact baud rate, FEC and coding depend on the standard/MSA.</text>
</svg>