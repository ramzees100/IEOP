<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Network Routing Methods | IEOP</title>

  <link rel="stylesheet" href="../../../style.css">
  <style>
  /* ==================================
     Routing hierarchy charts
  ================================== */

  .routing-chart {
    margin-top: 32px;
    padding: 32px;
    overflow: hidden;
  }

  .routing-chart-title {
    margin: 0 0 8px;
    text-align: center;
  }

  .routing-chart-intro {
    max-width: 760px;
    margin: 0 auto 30px;

    color: var(--muted);
    text-align: center;
  }

  .routing-tree {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .routing-node {
    min-width: 150px;
    max-width: 270px;

    padding: 16px 18px;

    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 14px;

    text-align: center;
  }

  .routing-node strong {
    display: block;
    color: var(--text);
  }

  .routing-node span {
    display: block;

    margin-top: 5px;

    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }

  .routing-root {
    min-width: 260px;

    background: linear-gradient(
      135deg,
      var(--primary),
      var(--primary-2)
    );

    border-color: transparent;
  }

  .routing-root strong,
  .routing-root span {
    color: #ffffff;
  }

  .routing-root span {
    opacity: 0.85;
  }

  .routing-leaf {
    min-width: 110px;
    background: rgba(25, 167, 160, 0.1);
  }

  .routing-line {
    width: 2px;
    height: 28px;

    background: var(--line);
  }

  .routing-grid {
    position: relative;

    display: grid;
    width: 100%;

    gap: 20px;
    padding-top: 28px;
  }

  .routing-grid::before {
    content: "";

    position: absolute;
    top: 0;

    height: 2px;
    background: var(--line);
  }

  .routing-grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .routing-grid-2::before {
    left: 25%;
    right: 25%;
  }

  .routing-grid-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .routing-grid-3::before {
    left: 16.67%;
    right: 16.67%;
  }

  .routing-grid-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .routing-grid-4::before {
    left: 12.5%;
    right: 12.5%;
  }

  .routing-branch {
    position: relative;

    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .routing-branch::before {
    content: "";

    position: absolute;
    top: -28px;

    width: 2px;
    height: 28px;

    background: var(--line);
  }

  .routing-leaves {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;

    gap: 10px;
  }

  .routing-note {
    max-width: 800px;

    margin: 28px auto 0;
    padding: 16px 18px;

    background: var(--surface-2);
    border-left: 4px solid var(--accent);
    border-radius: 10px;

    color: var(--muted);
  }


  /* ==================================
     Responsive charts
  ================================== */

  @media (max-width: 900px) {
    .routing-grid-4 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .routing-grid-4::before,
    .routing-grid-4 .routing-branch::before {
      display: none;
    }
  }

  @media (max-width: 650px) {
    .routing-chart {
      padding: 22px 16px;
    }

    .routing-grid-2,
    .routing-grid-3,
    .routing-grid-4 {
      grid-template-columns: 1fr;
      padding-top: 0;
    }

    .routing-grid::before,
    .routing-branch::before {
      display: none;
    }

    .routing-branch + .routing-branch {
      margin-top: 20px;
    }

    .routing-node {
      width: 100%;
      max-width: 340px;
    }
  }
</style>
</head>

<body>

  <main>

    <section class="page-hero">
      <div class="container">

        <span class="eyebrow">
          Optical Networking
        </span>

        <h1>Network Routing Methods</h1>

        <p>
          Learn how routers obtain routes and select paths toward
          network destinations.
        </p>

        <div class="button-row">
          <a class="btn btn-secondary" href="../index.html">
            Back to Optical Networking Fundamentals
          </a>
        </div>

      </div>
    </section>

  </main>

</body>

</html>
